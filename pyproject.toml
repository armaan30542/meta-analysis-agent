[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metakit"
version = "1.0.0"
description = "Auditable, AI-agent-driven meta-analysis: provenance-checked extraction, metafor-validated statistics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
metakit = "metakit.cli:main"

[tool.setuptools]
packages = ["metakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
